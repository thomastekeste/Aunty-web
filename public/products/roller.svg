<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F7F5F0"/>
  <!-- Roller head -->
  <rect x="140" y="100" width="120" height="70" rx="35" fill="none" stroke="#6B5040" stroke-width="5"/>
  <!-- Roller texture lines -->
  <line x1="175" y1="108" x2="175" y2="162" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="105" x2="200" y2="165" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
  <line x1="225" y1="108" x2="225" y2="162" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
  <!-- Neck connector -->
  <rect x="190" y="170" width="20" height="30" fill="none" stroke="#6B5040" stroke-width="4"/>
  <!-- Handle -->
  <rect x="183" y="200" width="34" height="120" rx="10" fill="none" stroke="#6B5040" stroke-width="5"/>
  <!-- Handle grip lines -->
  <line x1="188" y1="240" x2="212" y2="240" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
  <line x1="188" y1="260" x2="212" y2="260" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
  <line x1="188" y1="280" x2="212" y2="280" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
</svg>
