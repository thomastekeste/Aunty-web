<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F7F5F0"/>
  <!-- Head shape / durag cap -->
  <path d="M120 220 Q120 130 200 110 Q280 130 280 220" fill="none" stroke="#6B5040" stroke-width="6"/>
  <!-- Brim / front band -->
  <path d="M110 220 Q150 235 200 238 Q250 235 290 220" fill="none" stroke="#6B5040" stroke-width="5"/>
  <!-- Tails hanging down -->
  <path d="M200 110 Q210 80 230 60" fill="none" stroke="#6B5040" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 110 Q190 80 170 60" fill="none" stroke="#6B5040" stroke-width="4" stroke-linecap="round"/>
  <!-- Tail ties at back -->
  <path d="M200 238 Q210 280 230 320" fill="none" stroke="#6B5040" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 238 Q190 280 170 320" fill="none" stroke="#6B5040" stroke-width="4" stroke-linecap="round"/>
  <!-- Center seam -->
  <line x1="200" y1="110" x2="200" y2="238" stroke="#6B5040" stroke-width="2" opacity="0.4"/>
</svg>
